name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.lock.txt
          pip install pytest==9.0.3
      - name: Backend test suite (synthetic data only)
        run: python -m pytest api/tests -q
      - name: Known-pattern secret scan
        run: python scripts/security_scan.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix web
      - name: Type-check and production build
        run: npm run build --prefix web
      - name: Local assistant, currency parsing and conversion checks
        run: |
          node scripts/check_local_assistant.cjs > /dev/null
          node scripts/check_currency_ui.cjs
          node scripts/check_currency_view.cjs
          for set in heldout_eval heldout_eval_v2 heldout_eval_v3; do node scripts/evaluate_local_assistant.cjs $set --check > /dev/null; done

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python advisories (informational)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.lock.txt --no-deps --disable-pip
      - name: npm advisories (informational)
        run: npm audit --prefix web --omit=dev
