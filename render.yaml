services:
  - type: web
    name: safeledger-api
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pip install -r api/requirements.lock.txt
    startCommand: bash render_start.sh
    envVars:
      - key: SAFELEDGER_DB
        value: ./safeledger.sqlite3
      - key: SAFELEDGER_BUILD_COMMIT
        sync: false
      - key: SAFELEDGER_SIGNING_KEY
        generateValue: true
      - key: SAFELEDGER_LLM_PROFILE
        value: gemini_free
      - key: SAFELEDGER_LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: SAFELEDGER_LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: SAFELEDGER_LLM_ALLOWED_HOSTS
        value: generativelanguage.googleapis.com
      - key: SAFELEDGER_LLM_FREE_TIER_CONFIRMED
        value: "1"
      - key: SAFELEDGER_LLM_API_KEY
        sync: false          # Set manually in Render dashboard — never commit
      - key: SAFELEDGER_CORS_ORIGINS
        sync: false          # Set to https://capzoryx-copilot.vercel.app after deploy
      - key: SAFELEDGER_MAIL_RELAY_URL
        sync: false          # Google Apps Script web app that sends email through your Gmail
      - key: SAFELEDGER_MAIL_RELAY_SECRET
        sync: false          # Shared secret checked by that script — never commit
      - key: SAFELEDGER_VISION_MODEL
        sync: false          # Optional stronger model for photos
      - key: SAFELEDGER_GOOGLE_TRANSLATE_KEY
        sync: false          # Optional Google Cloud Translation key
