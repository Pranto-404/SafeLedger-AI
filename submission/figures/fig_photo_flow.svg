<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Photo to record data flow"><title>Photo to record data flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="430" fill="#ffffff"/><rect x="15" y="30" width="205" height="80" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="117.5" y="57.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">1  Phone or file</text><text x="117.5" y="73.0" text-anchor="middle" font-size="12" fill="#4c5b6d">JPG, PNG or WebP</text><text x="117.5" y="89.0" text-anchor="middle" font-size="12" fill="#4c5b6d">(owner only)</text><line x1="220" y1="70" x2="237" y2="70" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="237" y="30" width="205" height="80" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="339.5" y="57.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">2  Shrink in browser</text><text x="339.5" y="73.0" text-anchor="middle" font-size="12" fill="#4c5b6d">max 1800 px, about</text><text x="339.5" y="89.0" text-anchor="middle" font-size="12" fill="#4c5b6d">1 MB, re-encoded JPEG</text><line x1="442" y1="70" x2="459" y2="70" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="459" y="30" width="205" height="80" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="561.5" y="57.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">3  Server checks</text><text x="561.5" y="73.0" text-anchor="middle" font-size="12" fill="#4c5b6d">size, base64, magic bytes,</text><text x="561.5" y="89.0" text-anchor="middle" font-size="12" fill="#4c5b6d">smart assist on, rate limit</text><line x1="664" y1="70" x2="681" y2="70" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="681" y="30" width="205" height="80" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="783.5" y="57.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">4  Model reads photo</text><text x="783.5" y="73.0" text-anchor="middle" font-size="12" fill="#4c5b6d">one JSON object, any</text><text x="783.5" y="89.0" text-anchor="middle" font-size="12" fill="#4c5b6d">language, digits to 0-9</text><rect x="15" y="160" width="205" height="90" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="117.5" y="192.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">5  Second look?</text><text x="117.5" y="208.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Only if something is</text><text x="117.5" y="224.0" text-anchor="middle" font-size="12" fill="#4c5b6d">doubtful (see right)</text><polyline points="790,110 790,135 118,135 118,160" fill="none" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="237" y="160" width="205" height="90" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="339.5" y="177.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Checks that trigger it</text><text x="339.5" y="192.5" text-anchor="middle" font-size="11" fill="#4c5b6d">total missing, confidence</text><text x="339.5" y="207.5" text-anchor="middle" font-size="11" fill="#4c5b6d">&lt; 0.85, poor legibility,</text><text x="339.5" y="222.5" text-anchor="middle" font-size="11" fill="#4c5b6d">no supplier or date, items</text><text x="339.5" y="237.5" text-anchor="middle" font-size="11" fill="#4c5b6d">do not add up to total</text><line x1="220" y1="205" x2="237" y2="205" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="459" y="160" width="205" height="90" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="561.5" y="184.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">6  Normalise</text><text x="561.5" y="200.0" text-anchor="middle" font-size="12" fill="#4c5b6d">text cleaned, amount to</text><text x="561.5" y="216.0" text-anchor="middle" font-size="12" fill="#4c5b6d">exact minor units, currency</text><text x="561.5" y="232.0" text-anchor="middle" font-size="12" fill="#4c5b6d">checked, dates fixed</text><line x1="442" y1="205" x2="459" y2="205" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="681" y="160" width="205" height="90" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="783.5" y="184.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">7  Draft shown</text><text x="783.5" y="200.0" text-anchor="middle" font-size="12" fill="#4c5b6d">owner sees every field,</text><text x="783.5" y="216.0" text-anchor="middle" font-size="12" fill="#4c5b6d">warnings, can edit or</text><text x="783.5" y="232.0" text-anchor="middle" font-size="12" fill="#4c5b6d">discard</text><line x1="664" y1="205" x2="681" y2="205" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="681" y="300" width="205" height="90" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="783.5" y="324.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">8  Owner presses Add</text><text x="783.5" y="340.0" text-anchor="middle" font-size="12" fill="#4c5b6d">only now: records API,</text><text x="783.5" y="356.0" text-anchor="middle" font-size="12" fill="#4c5b6d">owner-only, idempotent,</text><text x="783.5" y="372.0" text-anchor="middle" font-size="12" fill="#4c5b6d">validated again</text><line x1="783" y1="250" x2="783" y2="300" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="237" y="300" width="427" height="90" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="450.5" y="332.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">9  Signed audit event RECORD_ADDED</text><text x="450.5" y="348.0" text-anchor="middle" font-size="12" fill="#4c5b6d">new dataset version, hash chain extended</text><text x="450.5" y="364.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Nothing before step 8 touches the books</text><line x1="681" y1="345" x2="664" y2="345" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="450" y="415" text-anchor="middle" font-size="11.5" fill="#14202e">The model never writes a record. A wrong reading is caught by the owner at step 7, not by the model.</text></svg>