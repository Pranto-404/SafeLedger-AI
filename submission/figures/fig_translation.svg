<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Translation pipeline"><title>Translation pipeline</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><rect x="20" y="30" width="200" height="90" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="120.0" y="55.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Fixed string list</text><text x="120.0" y="70.0" text-anchor="middle" font-size="11" fill="#4c5b6d">727 English phrases in</text><text x="120.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">api/app/ui_strings.json</text><text x="120.0" y="100.0" text-anchor="middle" font-size="11" fill="#4c5b6d">(extracted from the code)</text><rect x="260" y="30" width="190" height="90" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="355.0" y="55.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Translate once</text><text x="355.0" y="70.0" text-anchor="middle" font-size="11" fill="#4c5b6d">Google Translate if a key is</text><text x="355.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">set, else the cloud model;</text><text x="355.0" y="100.0" text-anchor="middle" font-size="11" fill="#4c5b6d">placeholders protected</text><rect x="490" y="30" width="190" height="90" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="585.0" y="55.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Check each result</text><text x="585.0" y="70.0" text-anchor="middle" font-size="11" fill="#4c5b6d">plain text, sane length,</text><text x="585.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">no &lt; or &gt;, every {name}</text><text x="585.0" y="100.0" text-anchor="middle" font-size="11" fill="#4c5b6d">kept exactly</text><rect x="720" y="30" width="160" height="90" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="800.0" y="55.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Cache in database</text><text x="800.0" y="70.0" text-anchor="middle" font-size="11" fill="#4c5b6d">table i18n_text,</text><text x="800.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">one row per phrase</text><text x="800.0" y="100.0" text-anchor="middle" font-size="11" fill="#4c5b6d">per language</text><line x1="220" y1="75" x2="260" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="450" y1="75" x2="490" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="680" y1="75" x2="720" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="190" width="200" height="90" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><text x="120.0" y="215.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Export to static files</text><text x="120.0" y="230.0" text-anchor="middle" font-size="11" fill="#4c5b6d">scripts/export_locales.py</text><text x="120.0" y="245.0" text-anchor="middle" font-size="11" fill="#4c5b6d">to web/public/locales/</text><text x="120.0" y="260.0" text-anchor="middle" font-size="11" fill="#4c5b6d">36 files, served by the CDN</text><polyline points="800,120 800,155 120,155 120,190" fill="none" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="290" y="190" width="270" height="90" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="425.0" y="215.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">In the browser</text><text x="425.0" y="230.0" text-anchor="middle" font-size="11" fill="#4c5b6d">1. static file (instant)</text><text x="425.0" y="245.0" text-anchor="middle" font-size="11" fill="#4c5b6d">2. then /api/i18n fills gaps</text><text x="425.0" y="260.0" text-anchor="middle" font-size="11" fill="#4c5b6d">3. English for anything missing</text><line x1="220" y1="235" x2="290" y2="235" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="610" y="190" width="270" height="90" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="745.0" y="215.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Limits</text><text x="745.0" y="230.0" text-anchor="middle" font-size="11" fill="#4c5b6d">allow-listed languages only,</text><text x="745.0" y="245.0" text-anchor="middle" font-size="11" fill="#4c5b6d">never client text, 30 model calls</text><text x="745.0" y="260.0" text-anchor="middle" font-size="11" fill="#4c5b6d">a minute, 5-minute back-off</text><line x1="610" y1="235" x2="560" y2="235" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="450" y="318" text-anchor="middle" font-size="12" fill="#14202e">Right-to-left languages (Arabic, Hebrew, Persian, Urdu) switch the page direction to rtl.</text><text x="450" y="342" text-anchor="middle" font-size="11.5" fill="#4c5b6d" font-style="italic">After the 20 Oct fix, server answers are merged into the static strings and never replace them.</text></svg>