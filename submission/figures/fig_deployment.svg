<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Deployment topology"><title>Deployment topology</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="480" fill="#ffffff"/><rect x="20" y="40" width="170" height="80" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><text x="105.0" y="66.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">GitHub</text><text x="105.0" y="83.5" text-anchor="middle" font-size="13" fill="#4c5b6d">repository (main)</text><text x="105.0" y="100.5" text-anchor="middle" font-size="13" fill="#4c5b6d">+ Actions CI</text><rect x="250" y="40" width="210" height="90" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="355.0" y="71.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">Vercel</text><text x="355.0" y="88.5" text-anchor="middle" font-size="13" fill="#4c5b6d">Static site (CDN), security</text><text x="355.0" y="105.5" text-anchor="middle" font-size="13" fill="#4c5b6d">headers, /api proxy</text><rect x="20" y="200" width="150" height="80" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="95.0" y="226.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">Browser</text><text x="95.0" y="243.5" text-anchor="middle" font-size="13" fill="#4c5b6d">React app, on the</text><text x="95.0" y="260.5" text-anchor="middle" font-size="13" fill="#4c5b6d">user's device</text><rect x="250" y="230" width="210" height="100" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="355.0" y="266.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">Render (free tier)</text><text x="355.0" y="283.5" text-anchor="middle" font-size="13" fill="#4c5b6d">FastAPI backend, one</text><text x="355.0" y="300.5" text-anchor="middle" font-size="13" fill="#4c5b6d">instance, Singapore</text><rect x="250" y="390" width="210" height="70" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="355.0" y="420.0" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">Turso</text><text x="355.0" y="437.0" text-anchor="middle" font-size="13" fill="#4c5b6d">libSQL database over HTTPS</text><rect x="700" y="215" width="180" height="70" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="790.0" y="245.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Gemini API</text><text x="790.0" y="261.0" text-anchor="middle" font-size="12" fill="#4c5b6d">free tier, optional model calls</text><rect x="700" y="305" width="180" height="70" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><text x="790.0" y="327.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">FX sources</text><text x="790.0" y="342.5" text-anchor="middle" font-size="11" fill="#4c5b6d">open.er-api.com,</text><text x="790.0" y="357.5" text-anchor="middle" font-size="11" fill="#4c5b6d">jsDelivr currency API</text><rect x="700" y="395" width="180" height="65" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="790.0" y="422.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Google Apps Script</text><text x="790.0" y="438.5" text-anchor="middle" font-size="12" fill="#4c5b6d">mail relay, sends via Gmail</text><rect x="20" y="360" width="170" height="80" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><text x="105.0" y="387.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Keep-alive pings</text><text x="105.0" y="402.5" text-anchor="middle" font-size="11" fill="#4c5b6d">GitHub Actions (10 min)</text><text x="105.0" y="417.5" text-anchor="middle" font-size="11" fill="#4c5b6d">+ UptimeRobot (owner)</text><line x1="190" y1="80" x2="250" y2="80" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="220.0" y="72" text-anchor="middle" font-size="11" fill="#14202e">auto deploy</text><line x1="150" y1="200" x2="250" y2="110" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="170" y="150" text-anchor="middle" font-size="11" fill="#14202e">pages, assets</text><line x1="355" y1="130" x2="355" y2="230" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="185" text-anchor="middle" font-size="11" fill="#14202e">/api/* rewrite</text><line x1="355" y1="330" x2="355" y2="390" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="380" y="365" text-anchor="middle" font-size="11" fill="#14202e">SQL</text><line x1="460" y1="250" x2="700" y2="245" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="580.0" y="240" text-anchor="middle" font-size="11" fill="#14202e">model calls</text><line x1="460" y1="285" x2="700" y2="335" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="585" y="300" text-anchor="middle" font-size="11" fill="#14202e">live rates</text><line x1="460" y1="315" x2="700" y2="420" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="560" y="385" text-anchor="middle" font-size="11" fill="#14202e">email codes</text><line x1="190" y1="385" x2="250" y2="320" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="205" y="372" text-anchor="middle" font-size="11" fill="#14202e">GET /api/health</text><text x="450" y="476" text-anchor="middle" font-size="11" fill="#4c5b6d">Secrets live only in Render environment variables. The browser talks to one address (Vercel); Render is reached through its proxy.</text></svg>