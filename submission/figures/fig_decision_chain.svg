<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Verified decision chain"><title>Verified decision chain</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="150" fill="#ffffff"/><rect x="10" y="40" width="112" height="70" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="66.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Owner-entered</text><text x="66.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">records</text><line x1="122" y1="75" x2="136" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="136" y="40" width="112" height="70" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="192.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Exact finance</text><text x="192.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">engine</text><line x1="248" y1="75" x2="262" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="262" y="40" width="112" height="70" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="318.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">AI explains or</text><text x="318.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">proposes (bounded)</text><line x1="374" y1="75" x2="388" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="388" y="40" width="112" height="70" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="444.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Server policy</text><text x="444.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">role, reserve, limit</text><line x1="500" y1="75" x2="514" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="514" y="40" width="112" height="70" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="570.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Independent</text><text x="570.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">human approval</text><line x1="626" y1="75" x2="640" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="40" width="112" height="70" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="696.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">One atomic</text><text x="696.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">ledger posting</text><line x1="752" y1="75" x2="766" y2="75" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="766" y="40" width="112" height="70" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="822.0" y="70.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Signed hash-</text><text x="822.0" y="85.0" text-anchor="middle" font-size="11" fill="#4c5b6d">chained audit</text><text x="450" y="22" text-anchor="middle" font-size="12" fill="#14202e" font-weight="700">Each step passes work forward only after the checks of the step before it</text><text x="450" y="135" text-anchor="middle" font-size="11.5" fill="#4c5b6d" font-style="italic">The AI sits in the middle, never at the end: it cannot reach posting.</text></svg>