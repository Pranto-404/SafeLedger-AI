<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="System components"><title>System components</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="22" text-anchor="middle" font-size="13" fill="#14202e" font-weight="700">Browser (React 19 + TypeScript, built with Vite)</text><rect x="20" y="34" width="860" height="130" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><rect x="35" y="50" width="155" height="100" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="112.5" y="71.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Pages</text><text x="112.5" y="87.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Overview, Add records,</text><text x="112.5" y="103.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Invoices, Cash flow,</text><text x="112.5" y="119.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Loans, Approvals,</text><text x="112.5" y="135.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Activity, Settings</text><rect x="205" y="50" width="155" height="100" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="282.5" y="79.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">On-device brain</text><text x="282.5" y="95.0" text-anchor="middle" font-size="12" fill="#4c5b6d">intent model,</text><text x="282.5" y="111.0" text-anchor="middle" font-size="12" fill="#4c5b6d">site guide,</text><text x="282.5" y="127.0" text-anchor="middle" font-size="12" fill="#4c5b6d">sentence parser</text><rect x="375" y="50" width="155" height="100" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="452.5" y="87.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Currency view</text><text x="452.5" y="103.0" text-anchor="middle" font-size="12" fill="#4c5b6d">exact BigInt</text><text x="452.5" y="119.0" text-anchor="middle" font-size="12" fill="#4c5b6d">conversion, rates</text><rect x="545" y="50" width="155" height="100" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="622.5" y="87.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Languages</text><text x="622.5" y="103.0" text-anchor="middle" font-size="12" fill="#4c5b6d">37, static files</text><text x="622.5" y="119.0" text-anchor="middle" font-size="12" fill="#4c5b6d">+ server cache, RTL</text><rect x="715" y="50" width="155" height="100" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="792.5" y="87.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">PDF report</text><text x="792.5" y="103.0" text-anchor="middle" font-size="12" fill="#4c5b6d">jsPDF, loaded</text><text x="792.5" y="119.0" text-anchor="middle" font-size="12" fill="#4c5b6d">only on demand</text><text x="450" y="192" text-anchor="middle" font-size="12" fill="#14202e" font-weight="700">HTTPS, JSON only, cookie session + header X-SafeLedger-Client: web</text><line x1="450" y1="166" x2="450" y2="180" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="450" y1="198" x2="450" y2="228" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="450" y="246" text-anchor="middle" font-size="13" fill="#14202e" font-weight="700">Backend (FastAPI + Pydantic 2, Python 3.12)</text><rect x="20" y="254" width="860" height="150" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><rect x="30" y="268" width="132" height="122" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="96.0" y="309.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Gate</text><text x="96.0" y="324.0" text-anchor="middle" font-size="11" fill="#4c5b6d">body limit, headers,</text><text x="96.0" y="339.0" text-anchor="middle" font-size="11" fill="#4c5b6d">session, rate limits,</text><text x="96.0" y="354.0" text-anchor="middle" font-size="11" fill="#4c5b6d">origin check</text><rect x="172" y="268" width="132" height="122" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="238.0" y="309.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Accounts</text><text x="238.0" y="324.0" text-anchor="middle" font-size="11" fill="#4c5b6d">sign-up/in, 2-step,</text><text x="238.0" y="339.0" text-anchor="middle" font-size="11" fill="#4c5b6d">recovery, email</text><text x="238.0" y="354.0" text-anchor="middle" font-size="11" fill="#4c5b6d">codes, sharing</text><rect x="314" y="268" width="132" height="122" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="380.0" y="316.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Records</text><text x="380.0" y="331.5" text-anchor="middle" font-size="11" fill="#4c5b6d">validated draft</text><text x="380.0" y="346.5" text-anchor="middle" font-size="11" fill="#4c5b6d">to versioned dataset</text><rect x="456" y="268" width="132" height="122" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="522.0" y="309.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Finance engine</text><text x="522.0" y="324.0" text-anchor="middle" font-size="11" fill="#4c5b6d">balance, forecast,</text><text x="522.0" y="339.0" text-anchor="middle" font-size="11" fill="#4c5b6d">duplicates, loans</text><text x="522.0" y="354.0" text-anchor="middle" font-size="11" fill="#4c5b6d">(no network, no AI)</text><rect x="598" y="268" width="132" height="122" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="664.0" y="309.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Approvals</text><text x="664.0" y="324.0" text-anchor="middle" font-size="11" fill="#4c5b6d">proposal, approval,</text><text x="664.0" y="339.0" text-anchor="middle" font-size="11" fill="#4c5b6d">posting, signed</text><text x="664.0" y="354.0" text-anchor="middle" font-size="11" fill="#4c5b6d">audit chain</text><rect x="740" y="268" width="132" height="122" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="806.0" y="309.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">AI helpers</text><text x="806.0" y="324.0" text-anchor="middle" font-size="11" fill="#4c5b6d">extract, scan, ask,</text><text x="806.0" y="339.0" text-anchor="middle" font-size="11" fill="#4c5b6d">agent, translate</text><text x="806.0" y="354.0" text-anchor="middle" font-size="11" fill="#4c5b6d">(drafts only)</text><line x1="450" y1="406" x2="450" y2="430" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="20" y="432" width="420" height="70" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="230.0" y="462.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Database (SQLite locally, Turso in production)</text><text x="230.0" y="478.0" text-anchor="middle" font-size="12" fill="#4c5b6d">27 tables; ledger and audit are immutable by trigger</text><rect x="460" y="432" width="420" height="70" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="670.0" y="462.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Outside calls, all made by the server</text><text x="670.0" y="478.0" text-anchor="middle" font-size="12" fill="#4c5b6d">Gemini (optional), FX rates, mail relay</text></svg>