<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Sign-in and session flow"><title>Sign-in and session flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><rect x="20" y="20" width="190" height="70" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="115.0" y="42.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Sign-in form</text><text x="115.0" y="57.5" text-anchor="middle" font-size="11" fill="#4c5b6d">username (any case),</text><text x="115.0" y="72.5" text-anchor="middle" font-size="11" fill="#4c5b6d">password, keep me signed in?</text><rect x="270" y="20" width="190" height="70" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="365.0" y="42.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Limits first</text><text x="365.0" y="57.5" text-anchor="middle" font-size="11" fill="#4c5b6d">wait-time lockouts, request</text><text x="365.0" y="72.5" text-anchor="middle" font-size="11" fill="#4c5b6d">budgets, before any hashing</text><rect x="520" y="20" width="190" height="70" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="615.0" y="42.75" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14202e">Check password</text><text x="615.0" y="57.25" text-anchor="middle" font-size="10.5" fill="#4c5b6d">scrypt N=32768, constant-time</text><text x="615.0" y="71.75" text-anchor="middle" font-size="10.5" fill="#4c5b6d">compare; unknown name same cost</text><line x1="210" y1="55" x2="270" y2="55" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="460" y1="55" x2="520" y2="55" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="750" y="20" width="130" height="70" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="815.0" y="50.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Wrong</text><text x="815.0" y="65.0" text-anchor="middle" font-size="11" fill="#4c5b6d">same generic answer</text><line x1="710" y1="55" x2="750" y2="55" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="730.0" y="47" text-anchor="middle" font-size="11" fill="#14202e">no</text><rect x="520" y="150" width="190" height="70" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="615.0" y="172.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Two-step on?</text><text x="615.0" y="187.5" text-anchor="middle" font-size="11" fill="#4c5b6d">authenticator or backup code,</text><text x="615.0" y="202.5" text-anchor="middle" font-size="11" fill="#4c5b6d">challenge token, 5 min</text><line x1="615" y1="90" x2="615" y2="150" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="632" y="125" text-anchor="middle" font-size="11" fill="#14202e">yes</text><rect x="270" y="150" width="190" height="70" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="365.0" y="172.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Session issued</text><text x="365.0" y="187.5" text-anchor="middle" font-size="11" fill="#4c5b6d">random 256-bit token,</text><text x="365.0" y="202.5" text-anchor="middle" font-size="11" fill="#4c5b6d">only its SHA-256 stored</text><line x1="520" y1="185" x2="460" y2="185" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="490.0" y="177" text-anchor="middle" font-size="11" fill="#14202e">code ok</text><polyline points="520,80 490,80 490,125 365,125 365,150" fill="none" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="430" y="118" text-anchor="middle" font-size="11" fill="#14202e">no 2-step</text><rect x="20" y="150" width="190" height="70" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="115.0" y="172.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Cookie (HttpOnly,</text><text x="115.0" y="187.5" text-anchor="middle" font-size="11" fill="#4c5b6d">SameSite=Lax, Secure)</text><text x="115.0" y="202.5" text-anchor="middle" font-size="11" fill="#4c5b6d">24 h, or 30 days if asked</text><line x1="270" y1="185" x2="210" y2="185" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="450" y="258" text-anchor="middle" font-size="13" fill="#14202e" font-weight="700">Every later request</text><rect x="20" y="270" width="190" height="80" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="115.0" y="297.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Browser sends cookie +</text><text x="115.0" y="312.5" text-anchor="middle" font-size="11" fill="#4c5b6d">X-SafeLedger-Client header,</text><text x="115.0" y="327.5" text-anchor="middle" font-size="11" fill="#4c5b6d">exact Origin on changes</text><rect x="270" y="270" width="190" height="80" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="365.0" y="297.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Server looks up the hash</text><text x="365.0" y="312.5" text-anchor="middle" font-size="11" fill="#4c5b6d">session valid, user active,</text><text x="365.0" y="327.5" text-anchor="middle" font-size="11" fill="#4c5b6d">role from the database</text><rect x="520" y="270" width="190" height="80" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="615.0" y="297.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Tenant and role come only</text><text x="615.0" y="312.5" text-anchor="middle" font-size="11" fill="#4c5b6d">from the session, never</text><text x="615.0" y="327.5" text-anchor="middle" font-size="11" fill="#4c5b6d">from the request body</text><rect x="750" y="270" width="130" height="80" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="815.0" y="297.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Session ends on</text><text x="815.0" y="312.5" text-anchor="middle" font-size="11" fill="#4c5b6d">logout, password</text><text x="815.0" y="327.5" text-anchor="middle" font-size="11" fill="#4c5b6d">change, removal</text><line x1="210" y1="310" x2="270" y2="310" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="460" y1="310" x2="520" y2="310" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="710" y1="310" x2="750" y2="310" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="390" width="860" height="60" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><text x="450.0" y="415.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Recovery: one-time recovery key, or a 6-digit emailed code (10 minutes, 5 tries)</text><text x="450.0" y="431.0" text-anchor="middle" font-size="12" fill="#4c5b6d">With two-step on, both also ask for an authenticator or backup code</text></svg>