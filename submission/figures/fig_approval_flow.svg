<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Payment approval flow"><title>Payment approval flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><rect x="20" y="30" width="170" height="80" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="105.0" y="57.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Owner (or approver)</text><text x="105.0" y="73.0" text-anchor="middle" font-size="12" fill="#4c5b6d">presses Prepare payment</text><text x="105.0" y="89.0" text-anchor="middle" font-size="12" fill="#4c5b6d">on one open invoice</text><rect x="250" y="30" width="190" height="80" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="345.0" y="57.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Server policy checks</text><text x="345.0" y="72.5" text-anchor="middle" font-size="11" fill="#4c5b6d">invoice open, not a duplicate,</text><text x="345.0" y="87.5" text-anchor="middle" font-size="11" fill="#4c5b6d">payee allowed, limit, reserve</text><rect x="500" y="30" width="190" height="80" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="595.0" y="57.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Proposal signed</text><text x="595.0" y="72.5" text-anchor="middle" font-size="11" fill="#4c5b6d">HMAC over payee, amount,</text><text x="595.0" y="87.5" text-anchor="middle" font-size="11" fill="#4c5b6d">source hash; expires in 15 min</text><rect x="740" y="30" width="140" height="80" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="810.0" y="65.0" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">AWAITING_</text><text x="810.0" y="82.0" text-anchor="middle" font-size="13" fill="#4c5b6d">APPROVAL</text><line x1="190" y1="70" x2="250" y2="70" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="70" x2="500" y2="70" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="690" y1="70" x2="740" y2="70" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="200" width="170" height="90" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="105.0" y="232.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">A different person</text><text x="105.0" y="248.0" text-anchor="middle" font-size="12" fill="#4c5b6d">with the approver role</text><text x="105.0" y="264.0" text-anchor="middle" font-size="12" fill="#4c5b6d">opens the proposal</text><rect x="250" y="200" width="190" height="90" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="345.0" y="232.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Approver ticks "I checked</text><text x="345.0" y="247.5" text-anchor="middle" font-size="11" fill="#4c5b6d">the supplier and amount"</text><text x="345.0" y="262.5" text-anchor="middle" font-size="11" fill="#4c5b6d">and echoes the exact hash</text><rect x="500" y="200" width="190" height="90" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="595.0" y="232.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Server re-checks all</text><text x="595.0" y="247.5" text-anchor="middle" font-size="11" fill="#4c5b6d">role, hash, expiry, policy,</text><text x="595.0" y="262.5" text-anchor="middle" font-size="11" fill="#4c5b6d">funds, duplicates</text><polyline points="810,110 810,160 105,160 105,200" fill="none" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="245" x2="250" y2="245" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="245" x2="500" y2="245" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="740" y="190" width="140" height="55" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="810.0" y="212.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">REJECTED</text><text x="810.0" y="228.5" text-anchor="middle" font-size="12" fill="#4c5b6d">nothing recorded</text><line x1="690" y1="215" x2="740" y2="217" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="715.0" y="203" text-anchor="middle" font-size="11" fill="#14202e">reject</text><rect x="740" y="265" width="140" height="55" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="810.0" y="287.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">APPROVED, then</text><text x="810.0" y="303.5" text-anchor="middle" font-size="12" fill="#4c5b6d">EXECUTED</text><line x1="690" y1="275" x2="740" y2="292" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="715.0" y="276" text-anchor="middle" font-size="11" fill="#14202e">approve</text><rect x="480" y="350" width="400" height="90" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="680.0" y="382.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">One atomic posting (all or nothing)</text><text x="680.0" y="398.0" text-anchor="middle" font-size="12" fill="#4c5b6d">cash -amount, payables +amount (sum = 0)</text><text x="680.0" y="414.0" text-anchor="middle" font-size="12" fill="#4c5b6d">approval + posting + audit in one transaction</text><line x1="810" y1="320" x2="810" y2="350" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="350" width="420" height="90" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="230.0" y="375.0" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">What never happens</text><text x="230.0" y="390.0" text-anchor="middle" font-size="11" fill="#4c5b6d">no bank transfer or outside payment call;</text><text x="230.0" y="405.0" text-anchor="middle" font-size="11" fill="#4c5b6d">the owner and the proposer cannot approve;</text><text x="230.0" y="420.0" text-anchor="middle" font-size="11" fill="#4c5b6d">a replay returns the same posting, not a second</text></svg>