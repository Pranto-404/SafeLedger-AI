<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Assistant routing"><title>Assistant routing</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5b6d"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><rect x="330" y="12" width="240" height="46" rx="9" fill="#ffffff" stroke="#8b97a6" stroke-width="1.4"/><text x="450.0" y="38.5" text-anchor="middle" font-size="13" font-weight="700" fill="#14202e">Message typed in chat</text><rect x="330" y="90" width="240" height="70" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="450.0" y="120.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14202e">1  Sounds like a payment or bill?</text><text x="450.0" y="135.5" text-anchor="middle" font-size="11.5" fill="#4c5b6d">sentence parser, on the device</text><line x1="450" y1="58" x2="450" y2="90" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="660" y="90" width="220" height="70" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="770.0" y="120.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Draft card</text><text x="770.0" y="136.0" text-anchor="middle" font-size="12" fill="#4c5b6d">owner checks, presses Add</text><line x1="570" y1="125" x2="660" y2="125" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="615.0" y="117" text-anchor="middle" font-size="11" fill="#14202e">yes</text><rect x="330" y="195" width="240" height="70" rx="9" fill="#e8f0fb" stroke="#2f6db5" stroke-width="1.4"/><text x="450.0" y="217.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">2  Known question?</text><text x="450.0" y="232.5" text-anchor="middle" font-size="11" fill="#4c5b6d">intent model + rules + site guide</text><text x="450.0" y="247.5" text-anchor="middle" font-size="11" fill="#4c5b6d">(on the device, no network)</text><line x1="450" y1="160" x2="450" y2="195" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="464" y="182" text-anchor="middle" font-size="11" fill="#14202e">no</text><rect x="660" y="195" width="220" height="70" rx="9" fill="#e6f4ee" stroke="#1d8a6a" stroke-width="1.4"/><text x="770.0" y="225.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Answer from your own</text><text x="770.0" y="241.0" text-anchor="middle" font-size="12" fill="#4c5b6d">figures, with sources</text><line x1="570" y1="230" x2="660" y2="230" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="615.0" y="222" text-anchor="middle" font-size="11" fill="#14202e">yes</text><rect x="20" y="195" width="230" height="70" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="135.0" y="217.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Asks to move money,</text><text x="135.0" y="232.5" text-anchor="middle" font-size="11" fill="#4c5b6d">reveal secrets, see another</text><text x="135.0" y="247.5" text-anchor="middle" font-size="11" fill="#4c5b6d">tenant, ignore rules?</text><line x1="330" y1="230" x2="250" y2="230" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="290" y="222" text-anchor="middle" font-size="11" fill="#14202e">matches</text><rect x="20" y="295" width="230" height="50" rx="9" fill="#fbe9e7" stroke="#b4443a" stroke-width="1.4"/><text x="135.0" y="323.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14202e">Refused on the device</text><line x1="135" y1="265" x2="135" y2="295" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="305" width="240" height="70" rx="9" fill="#fdf3dc" stroke="#b9811b" stroke-width="1.4"/><text x="450.0" y="327.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">3  Off topic?</text><text x="450.0" y="342.5" text-anchor="middle" font-size="11" fill="#4c5b6d">politely declined; never sent</text><text x="450.0" y="357.5" text-anchor="middle" font-size="11" fill="#4c5b6d">anywhere unless the owner insists</text><line x1="450" y1="265" x2="450" y2="305" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="485" y="290" text-anchor="middle" font-size="11" fill="#14202e">no match</text><rect x="330" y="405" width="240" height="70" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="450.0" y="427.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">4  Smart assist on and</text><text x="450.0" y="442.5" text-anchor="middle" font-size="11" fill="#4c5b6d">available?</text><text x="450.0" y="457.5" text-anchor="middle" font-size="11" fill="#4c5b6d">(owner's Settings switch counts)</text><line x1="450" y1="375" x2="450" y2="405" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="490" y="395" text-anchor="middle" font-size="11" fill="#14202e">in scope</text><rect x="660" y="405" width="220" height="70" rx="9" fill="#efeafb" stroke="#6a4fb0" stroke-width="1.4"/><text x="770.0" y="427.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Cloud model gets the</text><text x="770.0" y="442.5" text-anchor="middle" font-size="11" fill="#4c5b6d">question + a short figures</text><text x="770.0" y="457.5" text-anchor="middle" font-size="11" fill="#4c5b6d">summary. Answer is shown.</text><line x1="570" y1="440" x2="660" y2="440" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="615.0" y="432" text-anchor="middle" font-size="11" fill="#14202e">yes</text><rect x="20" y="405" width="230" height="70" rx="9" fill="#f2f4f7" stroke="#8b97a6" stroke-width="1.4"/><text x="135.0" y="427.5" text-anchor="middle" font-size="11" font-weight="700" fill="#14202e">Otherwise: "I can only</text><text x="135.0" y="442.5" text-anchor="middle" font-size="11" fill="#4c5b6d">answer that with smart</text><text x="135.0" y="457.5" text-anchor="middle" font-size="11" fill="#4c5b6d">assist" / not available</text><line x1="330" y1="440" x2="250" y2="440" stroke="#4c5b6d" stroke-width="1.6" marker-end="url(#a)"/><text x="290.0" y="432" text-anchor="middle" font-size="11" fill="#14202e">no</text><text x="450" y="505" text-anchor="middle" font-size="11.5" fill="#14202e">The assistant cannot approve, pay, or change records. The only write path is the draft card.</text></svg>